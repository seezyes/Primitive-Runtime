name: Vendor pinned JCode v0.99.0 source
on:
  push:
    paths:
      - '.github/workflows/vendor-jcode.yml'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          submodules: false
      - name: Download and verify exact stable release source
        shell: bash
        run: |
          set -euo pipefail
          tempdir="$(mktemp -d)"
          git clone --depth 1 --branch v0.99.0 https://github.com/1jehuang/jcode.git "$tempdir/jcode"
          test "$(git -C "$tempdir/jcode" rev-parse HEAD)" = "774613c90751b6a26ae9eb6a27be6aff3f210062"
          git rm -f Primitive-Runtime/engine/jcode/upstream
          git rm -f .gitmodules
          rm -rf Primitive-Runtime/engine/jcode
          mkdir -p Primitive-Runtime/engine/jcode
          tar -C "$tempdir/jcode" --exclude=.git -cf - . | tar -C Primitive-Runtime/engine/jcode -xf -
          test -f Primitive-Runtime/engine/jcode/Cargo.toml
          test -f Primitive-Runtime/engine/jcode/LICENSE
          mkdir -p Primitive-Runtime/engine
          cat > Primitive-Runtime/engine/JCODE_PROVENANCE.json <<'JSON'
          {
            "upstream_repository": "https://github.com/1jehuang/jcode",
            "upstream_release": "v0.99.0",
            "upstream_commit": "774613c90751b6a26ae9eb6a27be6aff3f210062",
            "import_method": "verified release-tag source tree, vendored files",
            "modifications": [],
            "status": "unmodified_upstream"
          }
          JSON
          git rm -f .github/workflows/vendor-jcode.yml
          git add -A
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Vendor JCode v0.99.0 stable source files'
          git push origin HEAD:main
