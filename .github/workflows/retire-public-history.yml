name: Retire obsolete public development references
on:
  push:
    branches: [main]
    paths: [".github/workflows/retire-public-history.yml"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current public distribution tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify only product sources are present
        shell: bash
        run: |
          set -euo pipefail
          test -f Primitive-Runtime/engine/jcode/modified/primitive/Cargo.toml
          test ! -d Primitive-Runtime/engine/jcode/upstream
          test ! -d Primitive-Runtime/docs
          test ! -d Primitive-Runtime/engine/jcode/modified/sdk
          test ! -d Primitive-Runtime/tests
          test -f Primitive-Runtime/package-lock.json
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Delete obsolete public development branch references
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for ref in feature/windows10-11-runtime review/primitive-runtime-v0.2; do
            status="$(curl -sS -o "$RUNNER_TEMP/delete-ref-response.json" -w "%{http_code}" -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/$ref")"
            if [[ "$status" != "204" && "$status" != "404" ]]; then
              echo "::error::Failed to delete $ref (HTTP $status)"
              cat "$RUNNER_TEMP/delete-ref-response.json"
              exit 1
            fi
            echo "Retired branch $ref ($status)"
          done

      - name: Replace public history with product-only root commit
        shell: bash
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD^{tree})"
          new_root="$(printf 'Publish Primitive Runtime product sources only\n' | \
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit-tree "$tree")"
          test "$(git cat-file -p "$new_root" | grep -c '^parent ' || true)" = "0"
          git push --force-with-lease="refs/heads/main:$GITHUB_SHA" origin "$new_root:refs/heads/main"
          echo "New orphaned main: $new_root"
